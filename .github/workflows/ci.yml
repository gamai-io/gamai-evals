name: ci
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --upgrade pip
      - run: python -m py_compile cua_eval_v11.py
      - run: python -c "import json,glob; [json.load(open(f)) for f in glob.glob('evals/*.json')]; print('manifests ok')"
