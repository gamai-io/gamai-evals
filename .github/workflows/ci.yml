name: ci
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with: {python-version: '3.11'}
      - run: python -m pip install --upgrade pip
      - run: python -m py_compile cua_eval_v11.py
      - run: python -c "import json,glob; [json.load(open(f)) for f in glob.glob('evals/*.json')]; print('manifests ok')"
      - run: python3 tools/trend_table.py --check
      - run: python -m pip install pytest && python -m pytest -q tests
